# Compressed swap for games. The stock zram0 is ram/2 with lzo-rle; that is
# 2.7 GB on the 6 GB alioth and can be exhausted by the Steam UI plus a Proton
# game. Use a fixed 4 GB and LZ4: benchmarked on alioth, LZ4 was ~2.4x faster
# to write and ~3.3x faster to read than zstd on a real /usr payload, at the
# cost of a lower ratio (1.48 vs 1.72). LZO-RLE is effectively tied with LZ4
# (same ratio, slightly faster writes but slower reads); zstd is only worth it
# when capacity matters more than latency. For game swap, latency wins.
[zram0]
zram-size = 4096
compression-algorithm = lz4
