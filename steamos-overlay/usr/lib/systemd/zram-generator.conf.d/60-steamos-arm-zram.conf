# Compressed swap for games. The stock zram0 is ram/2 with lzo-rle; that is
# 2.7 GB on the 6 GB alioth and can be exhausted by the Steam UI plus a Proton
# game. Use a fixed 3.5 GiB and lzo-rle: benchmarked on alioth, lzo-rle and
# LZ4 are effectively tied (same ratio; lzo-rle slightly faster writes, LZ4
# slightly faster reads), and lzo-rle is the stock algorithm. zstd is only
# worth it when capacity matters more than latency; for game swap, latency
# wins.
[zram0]
zram-size = 3584
compression-algorithm = lzo-rle
