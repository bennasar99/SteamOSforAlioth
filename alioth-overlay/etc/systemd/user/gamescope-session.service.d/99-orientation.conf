# Razer Kishi only: rotate the alioth panel 180 degrees.
#
# The Kishi's USB-C connector holds the phone with its USB-C edge on the
# controller side. In the default "right" orientation the picture is upside
# down; the 180-degree flip below fixes it for the Kishi.
#
# This file is paired with 71-alioth-flip.rules (the matching touch matrix).
# Install or remove both together; installing only one leaves either the
# picture or touch rotated 180 degrees. Without a Razer Kishi -- Bluetooth
# controller, a different USB-C controller, or no controller -- remove both
# files and use the unmodified orientation.
#
# The panel DTS says rotation = <90>; mainline maps that to
# DRM_MODE_PANEL_ORIENTATION_RIGHT_UP, so gamescope's auto orientation is
# "right" (270). The opposite orientation is "left" (90): the picture is
# flipped 180 while the 90-degree transpose that makes the portrait panel
# landscape is preserved. "upsidedown" would disable the transpose and give
# a portrait image.
[Service]
Environment=GAMESCOPE_ORIENTATION=left
