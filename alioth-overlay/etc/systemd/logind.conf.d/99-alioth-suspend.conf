# The Frame image sets HandlePowerKey=ignore and delegates the key to
# steamos-powerbuttond, which only sends steam://powerpress (open Steams's
# power menu). On this port that menu is not reliable, so the key appears dead.
# Suspend directly instead; s2idle is supported and was measured working.
# This drop-in sorts after 10-logind-no-powerbutton.conf.
[Login]
HandlePowerKey=suspend
